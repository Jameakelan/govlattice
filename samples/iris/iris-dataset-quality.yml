schema_version: "1.6.0"
policy:
  name: "iris-dataset-quality"
  purpose: "Validate Iris feature data before model training or inference."
  enabled: true
  severity: "high"
  tags:
    - "iris"
    - "dataset"
    - "quality"
  lifecycle_stages:
    - "data-validation"
  references: []
  owner: "data-quality-team"
  states:
    "validated_dataset":
      requirements:
        - type: "require_columns"
          columns:
            - "sepal_length"
            - "sepal_width"
            - "petal_length"
            - "petal_width"
            - "species"
        - type: "require_missing_rate"
          column: "sepal_length"
          maximum: 0.0
        - type: "require_missing_rate"
          column: "sepal_width"
          maximum: 0.0
        - type: "require_missing_rate"
          column: "petal_length"
          maximum: 0.0
        - type: "require_missing_rate"
          column: "petal_width"
          maximum: 0.0
        - type: "require_missing_rate"
          column: "species"
          maximum: 0.0
        - type: "require_range"
          column: "sepal_length"
          minimum: 4.0
          maximum: 9.0
        - type: "require_range"
          column: "sepal_width"
          minimum: 1.5
          maximum: 5.0
        - type: "require_range"
          column: "petal_length"
          minimum: 0.5
          maximum: 7.5
        - type: "require_range"
          column: "petal_width"
          minimum: 0.0
          maximum: 3.0
